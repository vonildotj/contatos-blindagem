name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Instalar dependências
        run: npm install

      - name: Inicializar Capacitor e Android
        run: |
          mkdir www
          cp index.html clientes.js "Logo Blindagem.jpeg" www/
          cp -r icons www/
          npx cap init "Contatos Blindagem" "com.vonildoj.blindagem" --web-dir www
          npx cap add android
          npx cap sync

      - name: Gerar Ícone do App Android
        run: |
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#0f172a' \
            --iconBackgroundColorDark '#0f172a' \
            --splashBackgroundColor '#0f172a' \
            --splashBackgroundColorDark '#0f172a'

      - name: Compilar APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          gradle assembleDebug

      - name: Fazer upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: app-blindagem-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
