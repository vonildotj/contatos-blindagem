name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Gradle via Download Direto
        run: |
          cd /tmp
          wget -q https://github.com/gradle/gradle-distributions/releases/download/v8.11.1/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "/tmp/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Instalar dependências
        run: npm install

      - name: Instalar ferramenta de Ícones
        run: npm install @capacitor/assets --save-dev

      - name: Inicializar Capacitor e Android
        run: |
          mkdir www
          cp index.html clientes.js "Logo Blindagem.jpeg" www/
          cp -r icons www/
          cp "Logo Blindagem.jpeg" www/logo.png
          npx cap init "Contatos Blindagem" "com.vonildoj.blindagem" --web-dir www
          npx cap add android
          npx cap sync

      - name: Gerar Ícone do App Android
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#0f172a' \
            --iconBackgroundColorDark '#0f172a' \
            --splashBackgroundColor '#0f172a' \
            --splashBackgroundColorDark '#0f172a'

      - name: Compilar APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Fazer upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: app-blindagem-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
